name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/Eniboard.slnx

      - name: Build
        run: dotnet build backend/Eniboard.slnx -c Release --no-restore

      - name: Test
        run: dotnet test backend/Eniboard.slnx -c Release --no-build

      - name: Publish
        run: >
          dotnet publish backend/src/Api/Api.csproj
          -c Release -r linux-x64 --self-contained false
          -o ${{ runner.temp }}/publish

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Copy build to VPS
        run: >
          rsync -avz --delete --omit-dir-times --no-perms
          --exclude=".aspnet/"
          "${{ runner.temp }}/publish/"
          "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}/"

      - name: Restart service
        run: >
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          "sudo systemctl restart eniboard-api"
